[program:maya-runtime-v1]
command=/usr/local/bin/node /opt/cleverwork/maya-runtime-v1/runtime/service.mjs
directory=/home/orgo/maya-agent-v1/runtime
user=maya-agent
autostart=true
autorestart=unexpected
startsecs=3
startretries=2
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/cleverwork/maya-runtime-v1.log
stdout_logfile_maxbytes=1048576
stdout_logfile_backups=2
environment=HOME="/home/orgo/maya-agent-v1",MAYA_ENABLED="false",NODE_ENV="production"
