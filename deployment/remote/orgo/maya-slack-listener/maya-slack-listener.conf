[program:maya-slack-listener]
command=/opt/pe-cc-agents/maya-slack-listener/start-listener.sh
directory=/home/orgo/maya-agent/runtime
user=maya-agent
autostart=false
autorestart=unexpected
startsecs=2
startretries=0
stopsignal=TERM
stopwaitsecs=65
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/pe-cc-agents/maya-slack-listener.log
stdout_logfile_maxbytes=1048576
stdout_logfile_backups=2
environment=HOME="/home/orgo/maya-agent",HERMES_HOME="/opt/pe-cc-agents/maya-hermes-home",NODE_ENV="production"
