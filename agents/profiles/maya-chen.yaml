slack:
  bot_display_name: "Maya Chen"
  app_name: "Maya Chen (Accounting)"
  app_id: "A0BD0PAEU2E"   # canonical Slack app (installed bot). Duplicates to delete.
  team_id: "T0B8QEGPVQW"
  bot_scopes:
    - "chat:write"
    - "channels:read"
    - "channels:history"
    - "channels:join"
    - "files:read"
    - "files:write"
    - "app_mentions:read"
  socket_mode_enabled: true

  listen_policy:
    mode: "all_human_operational_channels"
    respond_when: "in_sop_scope_or_directly_mentioned"
    overlap_resolution: "ops_conductor_decides"
    no_agent_dm: true
    ambient_response_allowed: true
    out_of_domain_behavior: "ignore_or_polite_decline"
    undefined_sop_behavior: "maya_asks_christopher_in_slack_for_context_and_routing_then_records_the_answer_for_sop_improvement"
    unclear_file_escalation: "ops_conductor_linear_ticket"
    owner_escalation:
      owner: "Christopher Hussey"
      channel: "Slack"
      preferred_location: "originating_operational_thread"
      sensitive_fallback: "approved_private_owner_channel_or_human_dm"
      required_prefix: "[MAYA]"
      blocked_marker: "[BLOCKED]"
      required_fields:
        - "source_or_assignment"
        - "work_completed_or_attempted"
        - "exact_blocker_or_ambiguity"
        - "recommended_route_or_bounded_options"
        - "specific_decision_or_context_needed"
      behavior: "Escalate promptly when blocked, ambiguous, outside authorization, missing access, or routing is unclear. Do not silently stop, repeatedly refuse, or wait without notifying Christopher. Continue unblocked work and resume the blocked task when he replies."
  channels:
    - name: "accounting-vendor-intake"
      id: "C0BCUF29G1H"
      purpose: "Human-facing operational channel; all named Roofing-Ops agents listen for in-scope requests."
    - name: "accounting-credit-memos"
      id: "C0BD4EW4RU4"
      purpose: "Human-facing operational channel; all named Roofing-Ops agents listen for in-scope requests."
    - name: "accounting-product-catalog-review"
      id: "C0BCYNW98RL"
      purpose: "Human-facing operational channel; all named Roofing-Ops agents listen for in-scope requests."

command_center:
  service_agent_id: "ob-accounting"
  departments:
    - "accounting"
    - "system"
  maps_to:
    - "@ob-accounting"
    - "Capture"
  permissions:
    - "command_center.read"
    - "work_queue.read"
    - "approval.request_more_evidence"
    - "evidence.attach"
    - "agent.resume"
    - "desktop.command_center_ui"
  approval_decide: false

hermes:
  model: "google/gemini-3.1-flash-lite"
  provider: "openrouter"
  tier: "structured"
  toolsets: []  # Composio calls are owned by the outer executor; Hermes is inference-only.
  skills: []
  cadence: "every-30-minutes"
  cron_schedule: "0,30 * * * *"  # Canonical runtime timer aligns to UTC half-hour boundaries.

integrations:
  abc_supply: true
  acculynx: false  # Maya doesn't need AccuLynx directly
  ghl: false       # GHL intake handled via Gmail aliases, not GHL directly
  agentmail_inbox: "ob-accounting@agentmail.proexteriorsus.net"
  google_drive_folders:
    - "Vendor Invoice Exports"
    - "Price Agreements"
    - "Open Invoice Reports"
    - "Credit Memo Packets"

domain_memory:
  fleet_fuel_card_relationship:
    fact: "The Vehicle Master List is the canonical fleet record and WEX is the fuel-card system attached to each vehicle record."
    join_rule: "Link WEX cards and transactions to the matching vehicle before reporting or creating work; prefer durable vehicle identifiers such as VIN, unit number, or license plate over display names."
    source: "Christopher Hussey instruction, 2026-07-28; Lucinda Dunn Vehicle Master List email thread 19f473a646ed499c."
    trust_tier: "instruction"

guardrails:
  no_external_send: false  # PEC-113: broad Maya Composio operations; mandatory owner CC remains enforced in code.
  email_required_cc: "admin@cc.proexteriorsus.net"
  no_approval_decide: true  # Payments, access-control changes, and irreversible deletion remain separate owner decisions.
  no_supabase_service_role: true
  no_public_internet: false  # needs browser for vendor portal downloads
  escalation_triggers:
    - "Document is unreadable, malformed, password-protected, or not classifiable"
    - "Supplier portal asks for new permissions, payment details, or MFA re-enrollment"
    - "PDF contains unexpected PII or legal documents outside invoice scope"
    - "hr@ or payroll@ alias receives any document — escalate immediately without extraction"
    - "Attachment is flagged as SPAM by Gmail — surface for human verification before processing"
    - "The assignment is ambiguous, blocked, outside authorization, missing required access, or lacks a clear owner — ask Christopher in Slack for context and routing"

credentials:
  openrouter_env_key: "OPENROUTER_API_KEY_MAYA"
  composio_env_key: "COMPOSIO_API_KEY"
